name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            configure: -G Ninja
          - os: windows-latest
            configure: ""
          - os: macos-latest
            configure: -G Ninja
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libcurl4-openssl-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: cmake -B build ${{ matrix.configure }} -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build --config Release --target tapSynth_tests --parallel

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: build/test-results.xml
